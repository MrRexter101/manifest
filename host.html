<body class="host">
<div id="gate" hidden></div>
<div id="app" hidden>
  <header class="h-top lip">
    <div class="brand"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><use href="#i-box"/></svg>Manifest <span class="faint">host</span></div>
    <span id="status" class="status"></span>
    <span class="spacer"></span>
    <span class="keys faint tiny">Keys: <kbd>J</kbd> join · <kbd>S</kbd> stage · <kbd>L</kbd> lock · <kbd>R</kbd> reveal · <kbd>B</kbd> board · <kbd>N</kbd> next</span>
    <button class="btn small" data-do="projector"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><use href="#i-screen"/></svg>Open projector</button>
    <button class="btn small" data-do="csv"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><use href="#i-download"/></svg>Export CSV</button>
    <button class="btn small ghost" data-do="reset" title="Wipe this room">Reset room</button>
  </header>
  <div class="h-grid">
    <nav id="agenda" class="h-agenda" aria-label="Agenda"></nav>
    <section class="h-mid">
      <div id="tabs" class="h-tabs" role="tablist"></div>
      <div id="mid" class="h-script"></div>
    </section>
    <aside class="h-side">
      <div id="controls" class="card h-controls"></div>
      <div id="acts" class="card h-acts"></div>
      <div id="room" class="card h-room"></div>
    </aside>
  </div>
