name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Plain files, no build. Only the public app ships: trainer/ holds the
      # script and answer keys and is gitignored, but this list is the real guard.
      - uses: actions/checkout@v4
      - name: Stage the site
        run: |
          mkdir -p _site
          cp index.html host.html screen.html _site/
          cp -R src assets vendor files _site/
          if [ -e _site/trainer ] || [ -e _site/research ] || [ -e _site/backend ]; then
            echo "::error::Non-public directory staged for publication"; exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
